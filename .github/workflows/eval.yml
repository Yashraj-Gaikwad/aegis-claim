name: AegisClaim Reliability Evaluation

on:
  push:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run reliability suite
        run: python -m pytest tests/ -v -W ignore

      - name: Verify CLI demo
        run: python main.py --scenario all
