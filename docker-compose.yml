services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:3000
      TWIN_MODE: "true"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
